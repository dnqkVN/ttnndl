<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Garena Account Checker API</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #111; padding: 20px; border: 1px solid #333; border-radius: 8px; }
        h1 { color: #ff6600; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .endpoint { background: #1a1a1a; padding: 15px; margin: 15px 0; border-left: 4px solid #ff6600; }
        .method { color: #ffff00; font-weight: bold; }
        .url { color: #00ffff; }
        textarea { width: 100%; height: 200px; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; }
        button { background: #ff6600; color: #000; border: none; padding: 10px 25px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #ff8800; }
        #result { background: #000; border: 1px solid #333; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; min-height: 100px; }
        .loading { color: #ffff00; }
        input { background: #000; color: #0f0; border: 1px solid #555; padding: 8px; width: 300px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 FF GARENA ACCOUNT CHECKER API</h1>
        <p>// Тул для проверки аккаунтов Free Fire по ID и Access Token</p>

        <div class="endpoint">
            <p><span class="method">POST</span> <span class="url">/api/check</span></p>
            <p>Тело запроса (JSON): {"player_id": "123456789", "access_token": "ваш_токен"}</p>
            <button onclick="testAPI()">🧪 ТЕСТИРОВАТЬ API</button>
        </div>

        <input type="text" id="playerId" placeholder="Player ID (например: 123456789)"><br>
        <input type="text" id="token" placeholder="Access Token"><br>
        <button onclick="checkAccount()">🚀 ПРОВЕРИТЬ АККАУНТ</button>
        <div id="result">Ожидание запроса...</div>
        
        <hr style="border-color: #333;">
        <h2>📋 ЛОГ ЗАПРОСОВ (СЕРВЕРНАЯ ЧАСТЬ)</h2>
        <textarea id="serverLog" readonly>Сервер запущен. Порт 3000.
        Доступные маршруты:
        - POST /api/check  (основная проверка)
        - GET  /api/health (состояние сервера)
        </textarea>
    </div>

    <script>
        // Базовый URL API. Если запускаете локально, оставьте так.
        // Для деплоя замените на ваш домен.
        const API_BASE = window.location.origin; 
        
        // Функция для отображения результата на странице
        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = JSON.stringify(data, null, 2);
        }

        // Функция для логирования на клиенте (отражает в textarea)
        function clientLog(message) {
            const logArea = document.getElementById('serverLog');
            logArea.textContent += '\n[CLIENT] ' + message;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // Тестирование конечной точки API из браузера
        async function testAPI() {
            const testData = {
                player_id: "888888888",
                access_token: "test_token_abc123"
            };
            clientLog('Отправка тестового запроса на /api/check...');
            try {
                const response = await fetch(`${API_BASE}/api/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                const data = await response.json();
                displayResult(data);
                clientLog('Тестовый ответ: ' + JSON.stringify(data));
            } catch (error) {
                displayResult({ error: 'Сервер не отвечает. Убедитесь, что он запущен.' });
                clientLog('ОШИБКА: ' + error.message);
            }
        }

        // Основная проверка по введенным данным
        async function checkAccount() {
            const playerId = document.getElementById('playerId').value.trim();
            const token = document.getElementById('token').value.trim();
            
            if (!playerId || !token) {
                alert('Введите Player ID и Access Token');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<span class="loading">⏳ Проверка через Garena API...</span>';
            clientLog(`Проверка ID: ${playerId} Token: ${token.substring(0, 5)}...`);

            try {
                const response = await fetch(`${API_BASE}/api/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_id: playerId, access_token: token })
                });
                const data = await response.json();
                displayResult(data);
                clientLog('Ответ: ' + JSON.stringify(data));
            } catch (error) {
                displayResult({ status: 'error', message: 'Не удалось подключиться к серверу.' });
                clientLog('ОШИБКА: ' + error.message);
            }
        }

        // Проверка здоровья сервера при загрузке
        window.addEventListener('load', async () => {
            try {
                const resp = await fetch(`${API_BASE}/api/health`);
                const health = await resp.json();
                clientLog('Сервер доступен: ' + JSON.stringify(health));
            } catch (e) {
                clientLog('ВНИМАНИЕ: Локальный сервер не запущен. Запустите Node.js часть.');
                document.getElementById('result').textContent = 'Сервер не запущен. Выполните "node server.js" в консоли.';
            }
        });
    </script>
</body>
</html>
