<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Key - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Hiệu ứng nền -->
    <canvas id="particles-bg"></canvas>
    
    <!-- Thông báo và Loading -->
    <div id="toast-container"></div>
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-section" class="container">
        <div class="login-box">
            <i class="fa-solid fa-fingerprint login-icon"></i>
            <h1>KHÓA <span>NEXUS</span></h1>
            <p>Hệ thống ủy quyền cao cấp</p>
            <button id="btn-google-login"><i class="fa-brands fa-google"></i> Đăng nhập bằng Google</button>
            <div id="login-error" class="hidden">Access Denied: You do not have admin privileges.</div>
        </div>
    </div>

    <!-- MÀN HÌNH DASHBOARD -->
    <div id="dashboard-section" class="container hidden">
        <header>
            <div class="user-info">
                <img id="user-avatar" src="" alt="Avatar">
                <div>
                    <h3 id="user-name">Admin</h3>
                    <p id="user-email">email@gmail.com</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="btn-create-header" class="btn-primary"><i class="fa-solid fa-plus"></i></button>
                <button id="btn-logout" class="btn-danger"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card"><h3>Total</h3><p id="stat-total">0</p></div>
            <div class="stat-card"><h3>Active</h3><p id="stat-active" class="text-success">0</p></div>
            <div class="stat-card"><h3>Expired</h3><p id="stat-expired" class="text-danger">0</p></div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search Device ID or Key...">
        </div>

        <!-- Bộ lọc trạng thái -->
        <div class="filter-container">
            <button class="filter-btn active">All Devices</button>
            <button class="filter-btn">Allowed Only</button>
            <button class="filter-btn">Banned Only</button>
        </div>

        <!-- VÙNG HIỂN THỊ CARD (Thay cho bảng cũ) -->
        <div id="keys-container" class="keys-grid">
            <!-- Code JavaScript sẽ tự động chèn Card vào đây -->
        </div>

        <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG (BOTTOM NAV) -->
        <div class="bottom-nav">
            <div class="nav-item">
                <i class="fa-solid fa-key"></i>
                <span>KEYS</span>
            </div>
            <div class="nav-item active">
                <i class="fa-solid fa-mobile-screen"></i>
                <span>DEVICES</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-sliders"></i>
                <span>CONFIG</span>
            </div>
        </div>
    </div>

    <!-- MODAL TẠO KEY -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Tạo Key Mới</h2>
            <div class="form-group">
                <label>Mã Key:</label>
                <div class="input-group">
                    <input type="text" id="key-preview">
                    <button id="btn-generate-random"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label>Thời hạn:</label>
                <select id="key-duration">
                    <option value="1">1 Ngày</option>
                    <option value="7">7 Ngày</option>
                    <option value="30">30 Ngày</option>
                    <option value="9999">Vĩnh viễn (Lifetime)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button id="btn-close-modal" class="btn-secondary">Hủy</button>
                <button id="btn-save-key" class="btn-primary">Lưu Key</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
