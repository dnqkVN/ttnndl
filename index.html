<!-- index.html (сохраните в папке public/index.html) -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Auto Token Checker</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #111; padding: 20px; border: 1px solid #333; border-radius: 8px; }
        h1 { color: #ff6600; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .info-box { background: #1a1a00; border: 1px solid #ffaa00; padding: 10px; margin: 10px 0; border-radius: 4px; color: #ffaa00; }
        .endpoint { background: #1a1a1a; padding: 15px; margin: 15px 0; border-left: 4px solid #00ff00; }
        input { background: #000; color: #0f0; border: 1px solid #555; padding: 12px; width: 70%; margin: 5px; font-size: 16px; }
        button { background: #ff6600; color: #000; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #ff8800; }
        #result { background: #000; border: 1px solid #333; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; min-height: 150px; max-height: 400px; overflow-y: auto; }
        .loading { color: #ffff00; }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        textarea { width: 100%; height: 100px; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 FF GARENA - ПРОВЕРКА ПО ID (ТОКЕН АВТО)</h1>
        
        <div class="info-box">
            ⚡ Теперь достаточно ввести только Player ID. Сервер автоматически получит токен и проверит аккаунт.
        </div>

        <div class="endpoint">
            <p><strong>POST /api/check</strong></p>
            <p>Тело запроса: <code>{ "player_id": "123456789" }</code></p>
        </div>

        <input type="text" id="playerId" placeholder="Введите Player ID (например: 987654321)"><br>
        <button onclick="checkAccount()">🔍 ПРОВЕРИТЬ АККАУНТ</button>
        
        <div id="result">
            <span style="color:#888;">Введите ID и нажмите "Проверить". Токен будет получен автоматически.</span>
        </div>

        <textarea id="serverLog" readonly>Журнал операций:
Сервер готов к работе.</textarea>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function clientLog(msg) {
            const logArea = document.getElementById('serverLog');
            logArea.textContent += '\n> ' + msg;
            logArea.scrollTop = logArea.scrollHeight;
        }

        async function checkAccount() {
            const playerId = document.getElementById('playerId').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!playerId) {
                alert('Пожалуйста, введите Player ID');
                return;
            }

            resultDiv.innerHTML = '<span class="loading">⏳ Шаг 1: Получение токена по ID... (это может занять несколько секунд)</span>';
            clientLog('Проверка ID: ' + playerId + ' (токен будет получен автоматически)');

            try {
                const response = await fetch(`${API_BASE}/api/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_id: playerId })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    resultDiv.innerHTML = `<span class="success">✅ АККАУНТ НАЙДЕН</span>\n\n` +
                        `👤 Ник: ${data.account_info.nickname}\n` +
                        `🆔 UID: ${data.account_info.uid}\n` +
                        `📊 Уровень: ${data.account_info.level}\n` +
                        `🌍 Регион: ${data.account_info.region}\n` +
                        `🔗 Токен получен: ${data.account_info.auto_token_used}\n\n` +
                        `Полный ответ:\n${JSON.stringify(data.raw_api_response, null, 2)}`;
                    clientLog('Успех: ' + data.account_info.nickname + ' (Уровень ' + data.account_info.level + ')');
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ОШИБКА</span>\n${JSON.stringify(data, null, 2)}`;
                    clientLog('Ошибка: ' + data.message);
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">❌ Сервер не отвечает. Убедитесь, что Node.js запущен.</span>';
                clientLog('КРИТИЧЕСКАЯ ОШИБКА: ' + error.message);
            }
        }

        window.addEventListener('load', async () => {
            try {
                const resp = await fetch(`${API_BASE}/api/health`);
                const health = await resp.json();
                clientLog('Сервер доступен. Версия: ' + health.service);
            } catch (e) {
                clientLog('ВНИМАНИЕ: Сервер не запущен. Выполните node server.js');
            }
        });
    </script>
</body>
</html>
