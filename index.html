<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Key Admin v1.2</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thêm icon để giống ảnh mẫu -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toast-container"></div>

    <!-- Màn hình đăng nhập -->
    <div id="login-section" class="container">
        <div class="login-box">
            <i class="fa-solid fa-cube neon-icon"></i>
            <h1>SERVER KEY <span>ADMIN</span></h1>
            <button id="btn-google-login"><i class="fa-brands fa-google"></i> Login with Google</button>
            <div id="login-error" class="hidden">Bạn không có quyền Admin!</div>
        </div>
    </div>

    <!-- Màn hình chính -->
    <div id="dashboard-section" class="container hidden">
        <header>
            <div class="header-left">
                <i class="fa-solid fa-cube"></i>
                <span>Server Key Admin v1.2</span>
            </div>
            <div class="header-right">
                <i class="fa-solid fa-palette"></i>
                <i class="fa-solid fa-rotate-right" onclick="location.reload()"></i>
            </div>
        </header>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search Device ID...">
        </div>

        <div class="filter-tabs">
            <button class="tab active">All Devices</button>
            <button class="tab">Allowed Only</button>
            <button class="tab">Banned Only</button>
        </div>

        <!-- Vùng chứa Card - Giữ nguyên ID keys-tbody của cậu -->
        <div id="keys-tbody" class="cards-list"></div>

        <!-- Thanh điều hướng dưới cùng (Bottom Nav) -->
        <div class="bottom-nav">
            <div class="nav-item"><i class="fa-solid fa-key"></i><span>KEYS</span></div>
            <div class="nav-item active"><i class="fa-solid fa-mobile-screen"></i><span>DEVICES</span></div>
            <div class="nav-item"><i class="fa-solid fa-sliders"></i><span>CONFIG</span></div>
        </div>

        <!-- Nút thêm mới -->
        <button id="btn-create-header" class="fab-btn"><i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- Modal tạo key -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Tạo Key Mới</h3>
            <input type="text" id="key-preview" placeholder="Mã Key">
            <select id="key-duration">
                <option value="1">1 Ngày</option>
                <option value="7">7 Ngày</option>
                <option value="30">30 Ngày</option>
                <option value="9999">Vĩnh viễn</option>
            </select>
            <div class="modal-actions">
                <button id="btn-close-modal">Hủy</button>
                <button id="btn-save-key">Lưu Key</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
    </html>
